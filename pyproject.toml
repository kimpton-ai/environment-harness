[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "environment-harness"
version = "0.2.4rc2"
description = "Durable sessions and evidence for independently implemented AI environments"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["ai-agents", "environments", "evaluation", "experiments"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = ["pydantic>=2.12.5,<3", "jsonschema>=4.26,<5"]

[project.urls]
Homepage = "https://github.com/kimpton-ai/environment-harness"
Repository = "https://github.com/kimpton-ai/environment-harness"
Documentation = "https://github.com/kimpton-ai/environment-harness#readme"
Changelog = "https://github.com/kimpton-ai/environment-harness/blob/main/CHANGELOG.md"
Issues = "https://github.com/kimpton-ai/environment-harness/issues"
Security = "https://github.com/kimpton-ai/environment-harness/security/policy"

[project.optional-dependencies]
server = ["fastapi>=0.135.1,<1", "uvicorn>=0.41,<1"]
postgres = ["psycopg[binary]>=3.3.3,<4"]
modal = ["modal>=1.5.4,<2"]
pettingzoo = ["pettingzoo>=1.25,<2", "pygame>=2.6.1,<3"]
signatures = ["cryptography>=50.0.1,<51"]
mcp = ["mcp>=1.30.0,<2"]
verifiers = ["verifiers>=0.3.1,<0.4", "datasets>=5.0.1,<6"]

[project.scripts]
environment-harness = "environment_harness.cli:main"

[dependency-groups]
dev = [
  "build>=1.4,<2",
  "cryptography>=50.0.1,<51",
  "cyclonedx-bom>=7,<8",
  "detect-secrets>=1.5,<2",
  "diff-cover>=9.7,<10",
  "hatchling==1.27.0",
  "httpx>=0.28.1,<1",
  "pip-audit>=2.10,<3",
  "pyright>=1.1.405,<2",
  "pytest>=9.0.3,<10",
  "pytest-cov>=7,<8",
  "pytest-xdist>=3.8,<4",
  "ruff>=0.15.6,<0.16",
]

[tool.hatch.build.targets.wheel]
packages = ["src/environment_harness"]

[tool.hatch.build.targets.sdist]
include = ["src", "contracts", "docs", "examples", "README.md", "CONTRIBUTING.md", "SECURITY.md", "SUPPORT.md", "CODE_OF_CONDUCT.md", "CHANGELOG.md", "LICENSE", "pyproject.toml", "uv.toml"]
exclude = ["**/.gitignore", ".context/**", "packages/typescript"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportIncompatibleMethodOverride = false
reportMissingImports = false

[tool.coverage.run]
branch = true
source = ["environment_harness"]

[tool.coverage.paths]
source = [
  "src/environment_harness",
  "/home/runner/work/environment-harness/environment-harness/src/environment_harness",
  "/Users/runner/work/environment-harness/environment-harness/src/environment_harness",
  "D:\\a\\environment-harness\\environment-harness\\src\\environment_harness",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
