repos:
  - repo: local
    hooks:
      - id: detect-secrets
        name: detect-secrets
        entry: uv run --no-sync detect-secrets-hook
        language: system
      - id: ruff-check
        name: ruff check
        entry: uv run --no-sync ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format
        language: system
        types_or: [python, pyi]
