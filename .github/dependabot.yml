version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    reviewers:
      - kimpton-ai/maintainers
  - package-ecosystem: npm
    directory: /packages/typescript
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    reviewers:
      - kimpton-ai/maintainers
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    reviewers:
      - kimpton-ai/maintainers
