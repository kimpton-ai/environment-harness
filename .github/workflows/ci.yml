name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  SUPPORTED_NPM: 11.17.0

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      compatibility: ${{ steps.paths.outputs.compatibility }}
      schema: ${{ steps.paths.outputs.schema }}
      integrations: ${{ steps.paths.outputs.integrations }}
      viewer: ${{ steps.paths.outputs.viewer }}
      documentation: ${{ steps.paths.outputs.documentation }}
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - id: paths
        name: Detect compatibility-sensitive changes
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" != pull_request ]; then
            compatibility=true
          else
            files="$RUNNER_TEMP/pull-request-files.json"
            changed_files="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '.changed_files')"
            gh api --paginate --slurp \
              "repos/$REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" > "$files"
            for impact in compatibility schema integrations viewer documentation; do
              value="$(python scripts/classify_ci_changes.py \
                --changed-files "$changed_files" --impact "$impact" "$files")"
              echo "$impact=$value" >> "$GITHUB_OUTPUT"
              printf -- '- %s: %s\n' "$impact" "$value" >> "$RUNNER_TEMP/ci-routing.txt"
            done
            compatibility="$(python scripts/classify_ci_changes.py \
              --changed-files "$changed_files" --impact compatibility "$files")"
          fi
          if [ "$EVENT_NAME" != pull_request ]; then
            for impact in compatibility schema integrations viewer documentation; do
              echo "$impact=true" >> "$GITHUB_OUTPUT"
            done
            printf -- '- all impacts: true\n' > "$RUNNER_TEMP/ci-routing.txt"
          fi
          printf '### CI routing\n\n' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/ci-routing.txt" >> "$GITHUB_STEP_SUMMARY"
      - id: shards
        name: Select compatibility shards
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Windows is ~4x the slowest Linux shard even in parallel. It runs in the
          # post-merge workflow instead, and on demand through workflow_dispatch.
          shards='[{"label":"linux-py313","os":"ubuntu-latest","python":"3.13"},
                   {"label":"linux-py314","os":"ubuntu-latest","python":"3.14"},
                   {"label":"macos-py312","os":"macos-latest","python":"3.12"}]'
          if [ "$EVENT_NAME" = pull_request ]; then
            selected="$(python -c 'import json,sys; print(json.dumps(json.loads(sys.argv[1])))' "$shards")"
          else
            selected="$(python -c 'import json,sys; s=json.loads(sys.argv[1]); s.append({"label":"windows-py312","os":"windows-latest","python":"3.12"}); print(json.dumps(s))' "$shards")"
          fi
          echo "shards=$selected" >> "$GITHUB_OUTPUT"
          printf -- '- shards: %s\n' "$(python -c 'import json,sys; print(", ".join(e["label"] for e in json.loads(sys.argv[1])))' "$selected")" >> "$GITHUB_STEP_SUMMARY"

  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: harness
          POSTGRES_PASSWORD: synthetic-local-only # pragma: allowlist secret (ephemeral test database)
          POSTGRES_DB: harness
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U harness -d harness"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENVIRONMENT_HARNESS_POSTGRES_URL: postgresql://harness:synthetic-local-only@127.0.0.1:5432/harness # pragma: allowlist secret (ephemeral test database)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@557e51de59eb14aaaba2ed9621916900a91d50c6 # v6.6.1
        with:
          version: "0.12.0"
          enable-cache: false
      - run: uv sync --frozen --extra server --extra postgres
      - run: uv run --no-sync pytest -n auto --cov --cov-branch --cov-report=term-missing --cov-report=json --cov-report=xml
      - run: uv run --no-sync python scripts/check_coverage.py
      - run: uv run --no-sync diff-cover coverage.xml --compare-branch=origin/main --fail-under=100
      - run: uv run --no-sync python scripts/check_regression_tests.py
      - run: uv run --no-sync python scripts/check_authorization_mutations.py
      - run: uv run --no-sync ruff format --check src tests scripts examples
      - run: uv run --no-sync ruff check src tests scripts examples
      - run: uv run --no-sync pyright
      - run: uv run --no-sync python scripts/build_contracts.py --check
      - run: uv run --no-sync python scripts/build_openapi.py --check
      - run: uv run --no-sync python scripts/build_http_migration.py --check

  compatibility:
    name: Compatibility (${{ matrix.label }})
    needs: changes
    if: needs.changes.outputs.compatibility == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.shards) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@557e51de59eb14aaaba2ed9621916900a91d50c6 # v6.6.1
        with:
          version: "0.12.0"
          enable-cache: false
      - run: uv sync --frozen --extra server
      - name: Run compatibility tests with branch coverage
        env:
          COVERAGE_FILE: coverage-${{ matrix.label }}
        run: uv run --no-sync pytest -q -n auto --cov --cov-branch --cov-report=
      - name: Upload compatibility coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: compatibility-coverage-${{ matrix.label }}
          path: coverage-${{ matrix.label }}
          if-no-files-found: error
          retention-days: 7

  integrations:
    name: Optional integrations
    needs: changes
    if: needs.changes.outputs.integrations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@557e51de59eb14aaaba2ed9621916900a91d50c6 # v6.6.1
        with:
          version: "0.12.0"
          enable-cache: false
      - run: uv sync --frozen --extra verifiers
      - run: uv run --no-sync pytest -q tests/test_framework_adapters.py
      - name: Verify the declared Verifiers range loads
        run: >-
          uv run --no-sync python -c
          "from environment_harness.adapters.frameworks import VerifiersRolloutConsumer;
          VerifiersRolloutConsumer(object())"

  cross-platform:
    name: Cross-platform
    if: always()
    needs: [changes, compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Require every compatibility shard
        env:
          CHANGE_RESULT: ${{ needs.changes.result }}
          COMPATIBILITY_REQUIRED: ${{ needs.changes.outputs.compatibility }}
          MATRIX_RESULT: ${{ needs.compatibility.result }}
        run: |
          test "$CHANGE_RESULT" = success
          if [ "$COMPATIBILITY_REQUIRED" = true ]; then
            test "$MATRIX_RESULT" = success
          else
            test "$MATRIX_RESULT" = skipped
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: needs.changes.outputs.compatibility == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: needs.changes.outputs.compatibility == 'true'
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@557e51de59eb14aaaba2ed9621916900a91d50c6 # v6.6.1
        if: needs.changes.outputs.compatibility == 'true'
        with:
          version: "0.12.0"
          enable-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.changes.outputs.compatibility == 'true'
        with:
          pattern: compatibility-coverage-*
          path: coverage-data
          merge-multiple: true
      - run: uv sync --frozen --extra server
        if: needs.changes.outputs.compatibility == 'true'
      - name: Combine and enforce cross-platform coverage
        if: needs.changes.outputs.compatibility == 'true'
        run: |
          uv run --no-sync coverage combine coverage-data/coverage-*
          uv run --no-sync coverage json
          uv run --no-sync python scripts/check_coverage.py

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: packages/typescript/package-lock.json
      - run: npm install --global "npm@${SUPPORTED_NPM}" --ignore-scripts
      - run: test "$(npm --version)" = "$SUPPORTED_NPM"
      - run: test "$(npm config get min-release-age)" = 7
      - run: npm ci --ignore-scripts --prefix packages/typescript
      - run: npm run typecheck --prefix packages/typescript
      - run: npm test --prefix packages/typescript
      - run: python scripts/build_viewer.py --check

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@557e51de59eb14aaaba2ed9621916900a91d50c6 # v6.6.1
        with:
          version: "0.12.0"
          enable-cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.2"
      - run: npm install --global "npm@${SUPPORTED_NPM}" --ignore-scripts
      - run: uv sync --frozen --extra server
      - run: npm ci --ignore-scripts --prefix packages/typescript
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        if: github.event_name == 'pull_request'
        with:
          fail-on-severity: high
      - name: Scan complete Git history for secrets
        run: >-
          docker run --rm --volume "$GITHUB_WORKSPACE:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --no-banner
      - uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
        with:
          advanced-security: false
          online-audits: false
          persona: pedantic
          min-severity: medium
          version: 1.30.0
      - run: uv run --no-sync detect-secrets scan
      - run: uv build
      - run: npm run build --prefix packages/typescript
      - run: npm pack --ignore-scripts --pack-destination ../../dist
        working-directory: packages/typescript
      - name: Verify repository policy and upstream publication metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --no-sync python scripts/check_repository.py --full
      - run: uv export --frozen --all-extras --no-dev --no-emit-project --no-hashes | uv run --no-sync pip-audit -r /dev/stdin
      - run: npm audit --audit-level=high --prefix packages/typescript
      - name: Scan vulnerabilities and malicious packages with OSV and OpenSSF data
        run: >-
          docker run --rm --volume "$GITHUB_WORKSPACE:/repo:ro"
          ghcr.io/google/osv-scanner-action:v2.5.1@sha256:dcd947131d8d11b8d0964de6590661fb921a4ecbd7b90a7cb21083acfc3fd8cc
          --lockfile=/repo/uv.lock
          --lockfile=/repo/packages/typescript/package-lock.json

  distribution:
    name: Distribution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@557e51de59eb14aaaba2ed9621916900a91d50c6 # v6.6.1
        with:
          version: "0.12.0"
          enable-cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.2"
      - run: npm install --global "npm@${SUPPORTED_NPM}" --ignore-scripts
      - run: uv sync --frozen --extra server
      - run: npm ci --ignore-scripts --prefix packages/typescript
      - run: python scripts/build_viewer.py --check
      - run: uv build
      - run: npm pack --ignore-scripts --pack-destination ../../dist
        working-directory: packages/typescript
      - run: uv run --no-sync python scripts/check_distribution.py
      - run: uv run --no-sync python scripts/check_release.py
      - run: uv run --no-sync python scripts/check_browser_security.py
      - run: uv run --no-sync python scripts/check_browser_ui.py
