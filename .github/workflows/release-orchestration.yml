name: Release orchestration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-orchestration.yml
      - .github/workflows/release.yml
      - scripts/release_version.py
      - CHANGELOG.md
      - README.md
      - pyproject.toml
      - uv.lock
      - packages/typescript/package.json
      - packages/typescript/package-lock.json
      - src/environment_harness/__init__.py
  workflow_dispatch:

concurrency:
  group: release-orchestration
  cancel-in-progress: false

permissions: {}

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      create: ${{ steps.release.outputs.create }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Detect an unreleased reviewed version
        id: release
        run: python scripts/release_version.py detect --github-output "$GITHUB_OUTPUT"

  tag:
    needs: detect
    if: needs.detect.outputs.create == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: release-app
        with:
          app-id: "3369417"
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Create the protected immutable version tag
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          RELEASE_TAG: ${{ needs.detect.outputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            --field ref="refs/tags/$RELEASE_TAG" \
            --field sha="$GITHUB_SHA"
