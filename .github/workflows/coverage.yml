name: Post-merge

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  upload:
    name: Publish Python coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.0"
          enable-cache: false
      - run: uv sync --frozen --extra server
      - run: uv run --no-sync pytest --cov --cov-branch --cov-report=json --cov-report=xml
      - run: uv run --no-sync python scripts/check_coverage.py
      - name: Publish coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.xml
          fail_ci_if_error: true
          use_oidc: true

  windows:
    name: Compatibility (windows-py312)
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.0"
          enable-cache: false
      - run: uv sync --frozen --extra server
      # The only runner that reaches the `os.name == "nt"` branches in
      # `adapters/_subprocess.py` and `store.py`. It is too slow to gate a pull
      # request, so a Windows regression surfaces on the merge that caused it.
      - run: uv run --no-sync pytest -q -n auto
