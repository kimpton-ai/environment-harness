name: Post-merge

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  upload:
    name: Publish Python coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: harness
          POSTGRES_PASSWORD: synthetic-local-only # pragma: allowlist secret (ephemeral test database)
          POSTGRES_DB: harness
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U harness -d harness"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENVIRONMENT_HARNESS_POSTGRES_URL: postgresql://harness:synthetic-local-only@127.0.0.1:5432/harness # pragma: allowlist secret (ephemeral test database)
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@557e51de59eb14aaaba2ed9621916900a91d50c6 # v6.6.1
        with:
          version: "0.12.0"
          enable-cache: false
      - run: uv sync --frozen --extra server --extra postgres
      - run: uv run --no-sync pytest --cov --cov-branch --cov-report=json --cov-report=xml
      - run: uv run --no-sync python scripts/check_coverage.py
      - name: Publish coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.xml
          fail_ci_if_error: true
          use_oidc: true

  windows:
    name: Compatibility (windows-py312)
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@557e51de59eb14aaaba2ed9621916900a91d50c6 # v6.6.1
        with:
          version: "0.12.0"
          enable-cache: false
      - run: uv sync --frozen --extra server
      # The only runner that reaches the `os.name == "nt"` branches in
      # `adapters/_subprocess.py` and `store.py`. It is too slow to gate a pull
      # request, so a Windows regression surfaces on the merge that caused it.
      - run: uv run --no-sync pytest -q -n auto
