name: Prepare release PR

on:
  workflow_dispatch:
    inputs:
      bump:
        description: SemVer component to advance
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: release-pr
  cancel-in-progress: false

permissions: {}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: release-app
        with:
          app-id: "3369417"
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@557e51de59eb14aaaba2ed9621916900a91d50c6 # v6.6.1
        with:
          version: "0.12.0"
          enable-cache: false
      - name: Promote Unreleased notes and synchronize package versions
        id: release
        env:
          RELEASE_BUMP: ${{ inputs.bump }}
        run: python scripts/release_version.py prepare --bump "$RELEASE_BUMP" --github-output "$GITHUB_OUTPUT"
      - name: Validate generated release change
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git diff --check
          uv lock --check
          python scripts/release_version.py validate --release-tag "$RELEASE_TAG"
      - name: Open the reviewed release PR
        env:
          BRANCH: release/${{ steps.release.outputs.tag }}
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "A release branch already exists: $BRANCH" >&2
            exit 1
          fi
          git switch --create "$BRANCH"
          git config user.name "kimpton-ci[bot]"
          git config user.email "275835657+kimpton-ci[bot]@users.noreply.github.com"
          git add CHANGELOG.md README.md pyproject.toml uv.lock packages/typescript/package.json \
            packages/typescript/package-lock.json src/environment_harness/__init__.py
          git commit --message "chore: release $RELEASE_TAG"
          gh auth setup-git
          git push origin "HEAD:refs/heads/$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "chore: release $RELEASE_TAG" \
            --body "Prepare EnvironmentHarness $VERSION. Merging this reviewed PR creates the protected tag and starts the attested release workflow."
