name: Prepare release pull request

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version line change; use none when advancing or finalizing a prerelease
        required: true
        default: none
        type: choice
        options:
          - none
          - patch
          - minor
          - major
      stage:
        description: Release stage
        required: true
        default: rc
        type: choice
        options:
          - stable
          - alpha
          - beta
          - rc
          - final

concurrency:
  group: release-prepare
  cancel-in-progress: false

permissions: {}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Prepare coordinated version metadata
        id: release
        env:
          BUMP: ${{ inputs.bump }}
          STAGE: ${{ inputs.stage }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          arguments=()
          case "$STAGE" in
            stable)
              test "$BUMP" != none
              arguments=(--bump "$BUMP")
              ;;
            alpha|beta|rc)
              if [ "$BUMP" = none ]; then
                arguments=(--prerelease "$STAGE")
              else
                arguments=(--bump "$BUMP" --prerelease "$STAGE")
              fi
              ;;
            final)
              test "$BUMP" = none
              arguments=(--final)
              ;;
            *)
              exit 1
              ;;
          esac
          python scripts/release_version.py prepare "${arguments[@]}" --github-output "$GITHUB_OUTPUT"
      - name: Commit and open the release pull request
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          branch="release/$RELEASE_TAG"
          if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
            echo "release branch already exists: $branch" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add \
            docs/STATUS.md \
            packages/typescript/README.md \
            packages/typescript/package-lock.json \
            packages/typescript/package.json \
            pyproject.toml \
            src/environment_harness/__init__.py \
            uv.lock \
            CHANGELOG.md
          git commit -m "chore: prepare $RELEASE_TAG"
          python scripts/release_version.py validate \
            --release-tag "$RELEASE_TAG" \
            --release-commit HEAD
          gh auth setup-git
          git push origin "HEAD:refs/heads/$branch"
          body="$RUNNER_TEMP/release-pr.md"
          printf '%s\n' \
            '## Summary' \
            '' \
            "- Prepare EnvironmentHarness $RELEASE_VERSION." \
            '- Synchronize the reviewed Python and TypeScript release metadata.' \
            '' \
            '## Publication' \
            '' \
            'After required checks and independent review, merge this PR and manually run the Attested GitHub release workflow with this PR number.' \
            > "$body"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "$RELEASE_TAG chore: prepare release" \
            --body-file "$body"
          # shellcheck disable=SC2016
          printf '### Release pull request\n\n- Version: `%s`\n- Branch: `%s`\n' \
            "$RELEASE_VERSION" "$branch" >> "$GITHUB_STEP_SUMMARY"
