name: Attested GitHub release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+a[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+b[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      python-artifact-id: ${{ steps.upload-python.outputs.artifact-id }}
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(a[1-9][0-9]*|b[1-9][0-9]*|rc[1-9][0-9]*)?$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require the release commit to be on main
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin main
          release_commit=$(git rev-parse "$RELEASE_TAG^{commit}")
          test "$(git rev-parse HEAD)" = "$release_commit"
          test "$GITHUB_SHA" = "$release_commit"
          git merge-base --is-ancestor "$release_commit" origin/main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.0"
          enable-cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # zizmor: ignore[cache-poisoning] v4.4.0 cache disabled below
        with:
          node-version: "22.23.2"
          cache: ""
      - run: npm install --global npm@11.17.0 --ignore-scripts
      - run: uv sync --frozen --extra server
      - run: npm ci --ignore-scripts --prefix packages/typescript
      - run: uv run --no-sync python scripts/build_viewer.py --check
      - run: uv build --no-build-isolation
      - run: npm pack --ignore-scripts --pack-destination ../../dist
        working-directory: packages/typescript
      - run: uv run --no-sync python scripts/check_repository.py --full --release-tag "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - run: uv run --no-sync python scripts/check_release.py
      - run: uv export --frozen --all-extras --no-dev --no-emit-project --no-hashes | uv run --no-sync pip-audit -r /dev/stdin
      - run: npm audit --audit-level=high --prefix packages/typescript
      - run: uv export --frozen --all-extras --no-dev --no-emit-project --output-file "$RUNNER_TEMP/release-requirements.txt"
      - run: uv run --no-sync cyclonedx-py requirements "$RUNNER_TEMP/release-requirements.txt" --output-reproducible --output-format JSON --output-file dist/python-sbom.cdx.json
      - run: npm sbom --sbom-format cyclonedx --prefix packages/typescript > dist/npm-sbom.cdx.json
      - run: cd dist && sha256sum -- * > SHA256SUMS
      - name: Upload reviewed artifacts
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: dist/
          if-no-files-found: error
          compression-level: 0
      - name: Upload reviewed Python distributions
        id: upload-python
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0

  attest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist
          merge-multiple: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

  publish:
    needs: [build, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: github-release
    permissions:
      contents: write
    steps:
      - name: Download artifact by immutable ID and verify service digest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist
          merge-multiple: true
      - name: Verify artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for artifact in dist/*; do
            gh attestation verify "$artifact" --repo "${{ github.repository }}"
          done
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            released="$RUNNER_TEMP/released"
            mkdir -p "$released"
            gh release download "$RELEASE_TAG" --repo "${{ github.repository }}" --dir "$released"
            test "$(find dist -maxdepth 1 -type f | wc -l)" -eq "$(find "$released" -maxdepth 1 -type f | wc -l)"
            for artifact in dist/*; do
              cmp "$artifact" "$released/$(basename "$artifact")"
            done
            exit 0
          fi
          prerelease=()
          if [[ "$RELEASE_TAG" =~ (a|b|rc)[0-9]+$ ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" dist/* --repo "${{ github.repository }}" --verify-tag --generate-notes "${prerelease[@]}"

  pypi:
    needs: [build, attest, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/environment-harness
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.python-artifact-id }}
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
