name: Attested GitHub release

on:
  workflow_dispatch:
    inputs:
      release_pr:
        description: Number of the merged pull request that introduced the current release version
        required: true
        type: string

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions: {}

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release_pr: ${{ steps.release.outputs.pr }}
      release_sha: ${{ steps.release.outputs.revision }}
      release_origin: ${{ steps.release.outputs.origin }}
      release_tag: ${{ steps.release.outputs.tag }}
      release_version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Resolve the reviewed version-introducing pull request
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ inputs.release_pr }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          [[ "$RELEASE_PR" =~ ^[1-9][0-9]*$ ]]
          pull_request="$RUNNER_TEMP/release-pr.json"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$RELEASE_PR" > "$pull_request"
          python scripts/release_version.py resolve \
            --pull-request-file "$pull_request" \
            --workflow-sha "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT"
      - name: Summarize the resolved release
        env:
          RELEASE_PR: ${{ steps.release.outputs.pr }}
          RELEASE_ORIGIN: ${{ steps.release.outputs.origin }}
          RELEASE_SHA: ${{ steps.release.outputs.revision }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          # shellcheck disable=SC2016
          printf '### Resolved release\n\n- Pull request: `#%s`\n- Version origin: `%s`\n- Release commit: `%s`\n- Tag: `%s`\n' \
            "$RELEASE_PR" "$RELEASE_ORIGIN" "$RELEASE_SHA" "$RELEASE_TAG" \
            >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      python-artifact-id: ${{ steps.upload-python.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bind the build to the reviewed release commit
        env:
          RELEASE_SHA: ${{ needs.resolve.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
        run: |
          test "$GITHUB_SHA" = "$RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          git tag "$RELEASE_TAG" "$RELEASE_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.0"
          enable-cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # zizmor: ignore[cache-poisoning] v4.4.0 cache disabled below
        with:
          node-version: "22.23.2"
          cache: ""
      - run: npm install --global npm@11.17.0 --ignore-scripts
      - run: uv sync --frozen --extra server
      - run: npm ci --ignore-scripts --prefix packages/typescript
      - run: uv run --no-sync python scripts/build_viewer.py --check
      - run: uv build --no-build-isolation
      - run: npm pack --ignore-scripts --pack-destination ../../dist
        working-directory: packages/typescript
      - run: >-
          uv run --no-sync python scripts/check_repository.py --full
          --release-tag "$RELEASE_TAG" --release-origin "$RELEASE_ORIGIN"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_ORIGIN: ${{ needs.resolve.outputs.release_origin }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
      - run: uv run --no-sync python scripts/check_release.py
      - run: uv export --frozen --all-extras --no-dev --no-emit-project --no-hashes | uv run --no-sync pip-audit -r /dev/stdin
      - run: npm audit --audit-level=high --prefix packages/typescript
      - run: uv export --frozen --all-extras --no-dev --no-emit-project --output-file "$RUNNER_TEMP/release-requirements.txt"
      - run: uv run --no-sync cyclonedx-py requirements "$RUNNER_TEMP/release-requirements.txt" --output-reproducible --output-format JSON --output-file dist/python-sbom.cdx.json
      - run: npm sbom --sbom-format cyclonedx --prefix packages/typescript > dist/npm-sbom.cdx.json
      - run: cd dist && sha256sum -- * > SHA256SUMS
      - name: Upload reviewed artifacts
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: dist/
          if-no-files-found: error
          compression-level: 0
      - name: Upload reviewed Python distributions
        id: upload-python
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0

  attest:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist
          merge-multiple: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

  tag:
    needs: [resolve, build, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release-tag
    permissions:
      contents: write
    steps:
      - name: Create the immutable release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.resolve.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
        run: |
          tag_response="$RUNNER_TEMP/tag-ref.json"
          tag_error="$RUNNER_TEMP/tag-ref.err"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
            --jq '.object.sha' >"$tag_response" 2>"$tag_error"; then
            existing="$(<"$tag_response")"
            [[ "$existing" =~ ^[0-9a-f]{40}$ ]]
            test "$existing" = "$RELEASE_SHA"
          else
            if ! jq -e '.status == "404" and .message == "Not Found"' \
              "$tag_response" >/dev/null; then
              sed -n '1,20p' "$tag_error" >&2
              sed -n '1,20p' "$tag_response" >&2
              exit 1
            fi
            gh api "repos/$GITHUB_REPOSITORY/git/refs" \
              --method POST \
              --field ref="refs/tags/$RELEASE_TAG" \
              --field sha="$RELEASE_SHA" >/dev/null
          fi
          # shellcheck disable=SC2016
          printf '### Protected tag\n\n`%s` → `%s`\n' \
            "$RELEASE_TAG" "$RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: [resolve, build, attest, tag]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: github-release
    permissions:
      contents: write
    steps:
      - name: Download artifact by immutable ID and verify service digest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist
          merge-multiple: true
      - name: Verify artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for artifact in dist/*; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY"
          done
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            released="$RUNNER_TEMP/released"
            mkdir -p "$released"
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$released"
            test "$(find dist -maxdepth 1 -type f | wc -l)" -eq "$(find "$released" -maxdepth 1 -type f | wc -l)"
            for artifact in dist/*; do
              cmp "$artifact" "$released/$(basename "$artifact")"
            done
            exit 0
          fi
          prerelease=()
          if [[ "$RELEASE_TAG" =~ (a|b|rc)[0-9]+$ ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes "${prerelease[@]}"

  pypi:
    needs: [resolve, build, attest, tag, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/environment-harness
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.python-artifact-id }}
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
